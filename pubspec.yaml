name: sdzaha_id
description: "Aplikasi Android SD ZAHA.ID"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  pdf: ^3.10.4         # ✅ Ditambahkan untuk fitur Export PDF
  printing: ^5.11.1    # ✅ Ditambahkan untuk render/cetak PDF
  file_picker: ^8.0.0  # ✅ Ditambahkan untuk memilih file Excel
  excel: ^4.0.6        # ✅ Ditambahkan untuk membaca file Excel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # ✅ Daftarkan lokasi file ikon/aset
  assets:
    - assets/app_icon.png

# ✅ Pengaturan Ikon Aplikasi — Latar Putih Sesuai Gambar
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  # ✅ Latar belakang ikon ANDROID = PUTIH (sesuai gambarmu)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true